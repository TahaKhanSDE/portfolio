name: Production CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Run Strict TypeScript Verification
        run: npx tsc --noEmit

      - name: Run ESLint Code Hygiene Checks
        run: npm run lint

      - name: Verify Production Next.js Build
        run: npm run build
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci_test_jwt_secret_key_minimum_32_chars' }}
          ADMIN_INITIAL_PASSWORD: ${{ secrets.ADMIN_INITIAL_PASSWORD || 'wingslug2026' }}
          ADMIN_GMAIL: ${{ secrets.ADMIN_GMAIL || 'mohd.tahakhan9@gmail.com' }}
          SECONDARY_GMAIL: ${{ secrets.SECONDARY_GMAIL || 'thinkercol@gmail.com' }}
          MONGODB_URI: ${{ secrets.MONGODB_URI || '' }}